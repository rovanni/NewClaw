name: regressao

# Suíte de regressão do NewClaw (src/__tests__/regression/*.test.ts), um subprocesso por arquivo, decidido pelo exit code.
# O runner (scripts/run-regression-tests.cjs) é a ÚNICA fonte da decisão passa/falha: falha quando nenhum teste é descoberto,
# quando um teste pendura (timeout) ou sai com 0 mas imprimiu "FALHOU:"; e grava um relatório estruturado com a duração de cada teste.
# Sem segredos e sem serviços externos: nada aqui chama a nuvem.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Mesmo shell nos dois sistemas: os comandos abaixo rodam idênticos em Linux e Windows (Git Bash no windows-latest).
defaults:
  run:
    shell: bash

concurrency:
  group: regressao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressao:
    name: regressão (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.2, 24.15.0]   # mínimos declarados; cada runner instala npm 12.2.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Fixar npm com allowScripts
        run: npm install --global npm@12.2.0

      # Instalação reproduzível: o lockfile manda. O peer opcional newclaw-kernel-adapter não força
      # um link local ausente em clones isolados; build e runtime sem ele têm cobertura S203.
      - name: Instalar dependências
        run: npm ci

      - name: Tipos (código de produção)
        run: npx tsc --noEmit

      # Prova que o próprio runner detecta falha, inconsistência, timeout e "zero testes" antes de confiar no verde dele.
      - name: Autoteste do runner
        run: npm run test:regression:selftest

      - name: Suíte de regressão
        run: npm run test:regression -- --report regressao-relatorio.json

      - name: Relatório (duração por teste)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regressao-relatorio-${{ matrix.os }}
          path: regressao-relatorio.json
          if-no-files-found: error
