<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NewClaw — Architecture Knowledge Base</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

:root {
  --bg: #f5f6f8; --bg-elev: #ffffff; --text: #1a1d23; --text-dim: #5b6270;

  --green: #1a8a4a; --yellow: #a56600; --red: #c4302b; --gray: #6b7280;
  --code-bg: #f0f1f4; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#14161a; --bg-elev:#1d2025; --text:#e7e9ee; --text-dim:#9aa1ad;
    --border:#2b2f36; --accent:#5b93ff; --accent-dim:#20293d; --code-bg:#161a20;
    --green:#3ecb7e; --yellow:#e0a72e; --red:#ff6b64; --gray:#9aa1ad; --shadow:0 1px 3px rgba(0,0,0,.4); }
}
:root[data-theme="dark"] { --bg:#14161a; --bg-elev:#1d2025; --text:#e7e9ee; --text-dim:#9aa1ad;
  --border:#2b2f36; --accent:#5b93ff; --accent-dim:#20293d; --code-bg:#161a20;
  --green:#3ecb7e; --yellow:#e0a72e; --red:#ff6b64; --gray:#9aa1ad; --shadow:0 1px 3px rgba(0,0,0,.4); }
:root[data-theme="light"] { --bg:#f5f6f8; --bg-elev:#ffffff; --text:#1a1d23; --text-dim:#5b6270;
  --border:#dfe3e8; --accent:#2f6fed; --accent-dim:#e8effd;
  --green:#1a8a4a; --yellow:#a56600; --red:#c4302b; --gray:#6b7280; --shadow:0 1px 3px rgba(0,0,0,.08); }

* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body { background:var(--bg); color:var(--text); font: 14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; overflow:hidden; }
#app { display:flex; height:100vh; }

/* Sidebar */
#sidebar { width:260px; flex:none; background:var(--bg-elev); border-right:1px solid var(--border); overflow-y:auto; padding:12px 0; }
#sidebar .brand { padding:6px 16px 14px; font-weight:700; font-size:15px; }
#sidebar .brand small { display:block; font-weight:400; color:var(--text-dim); font-size:11px; margin-top:2px; }
.nav-group { margin-bottom:2px; }
.nav-section-title { padding:10px 16px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); }
.nav-item { display:flex; justify-content:space-between; align-items:center; padding:6px 16px; cursor:pointer; color:var(--text); text-decoration:none; border-left:2px solid transparent; font-size:13px; }
.nav-item:hover { background:var(--accent-dim); }
.nav-item.active { background:var(--accent-dim); border-left-color:var(--accent); font-weight:600; }
.nav-item .count { color:var(--text-dim); font-size:11px; background:var(--code-bg); border-radius:10px; padding:1px 7px; }

/* Main */
#main { flex:1; overflow-y:auto; padding:24px 32px; }
#searchbar { position:sticky; top:0; z-index:5; background:var(--bg); padding-bottom:14px; margin-bottom:10px; }
#searchbar input { width:100%; max-width:420px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text); font-size:13px; }
#searchresults { position:absolute; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); max-width:420px; width:100%; max-height:320px; overflow-y:auto; z-index:10; display:none; }
#searchresults .sr-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border); }
#searchresults .sr-item:hover { background:var(--accent-dim); }
#searchresults .sr-item small { display:block; color:var(--text-dim); }

h1 { font-size:20px; margin:0 0 4px; }
h2 { font-size:16px; margin:28px 0 10px; }
.subtitle { color:var(--text-dim); font-size:13px; margin-bottom:20px; }

.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-bottom:8px; }
.card { background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); cursor:pointer; }
.card .num { font-size:26px; font-weight:700; }
.card .label { color:var(--text-dim); font-size:12px; margin-top:2px; }

.badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge.high { background:rgba(26,138,74,.12); color:var(--green); }
.badge.medium { background:rgba(165,102,0,.12); color:var(--yellow); }
.badge.low { background:rgba(107,114,128,.15); color:var(--gray); }
.badge.type { background:var(--accent-dim); color:var(--accent); }

table { width:100%; border-collapse:collapse; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
th { color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; }
tr:last-child td { border-bottom:none; }
tr.rowlink { cursor:pointer; }
tr.rowlink:hover { background:var(--accent-dim); }

.pill-link { color:var(--accent); cursor:pointer; text-decoration:none; }
.pill-link:hover { text-decoration:underline; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { background:var(--code-bg); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; }
.chip:hover { border-color:var(--accent); }

.panel { background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
.panel h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-dim); }
.risk-item, .obs-item, .todo-item { padding:6px 0; border-bottom:1px dashed var(--border); font-size:13px; }
.risk-item:last-child, .obs-item:last-child, .todo-item:last-child { border-bottom:none; }
code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
code.path { background:var(--code-bg); padding:1px 6px; border-radius:4px; font-size:12px; }
pre.mermaid-src { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:14px; overflow-x:auto; font-size:12.5px; white-space:pre; }
.copybtn { float:right; font-size:11px; padding:2px 8px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elev); cursor:pointer; color:var(--text); }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:900px) { .two-col { grid-template-columns:1fr; } }

/* Graph view */
#graph-controls { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
#graph-controls select, #graph-controls input[type=text] { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text); }
#graph-wrap { position:relative; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; height:560px; overflow:hidden; }
#graph-svg { width:100%; height:100%; cursor:grab; }
#graph-svg:active { cursor:grabbing; }
#graph-legend { position:absolute; top:10px; left:10px; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:11px; }
#graph-legend div { display:flex; align-items:center; gap:6px; margin:2px 0; }
#graph-legend .sw { width:10px; height:10px; border-radius:2px; }
#graph-detail { position:absolute; top:10px; right:10px; width:260px; max-height:90%; overflow-y:auto; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:12px; display:none; }
.node-label { font-size:10px; fill:var(--text); pointer-events:none; }
.scroll-x { overflow-x:auto; }
</style>
</head>

<script>
const ARCH = JSON.parse(document.getElementById('ARCH_DATA').textContent);
const GRAPH = JSON.parse(document.getElementById('GRAPH_DATA').textContent);
const METRICS = JSON.parse(document.getElementById('METRICS_DATA').textContent);

const byPath = {};
ARCH.components.forEach(c => byPath[c.path] = c);

const LAYER_ORDER = ["Core","Providers","Models","Planner","Goal Execution","Agents","Memory","Skills","Tools","Channels","API","Dashboard","Services","Session","Cognitive","Infrastructure","Scripts","Tests"];
const layers = {};
ARCH.components.forEach(c => { (layers[c.layer] = layers[c.layer] || []).push(c); });

function esc(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function nav(hash) { location.hash = hash; }
function encodePath(p) { return encodeURIComponent(p); }

/* ---------------- Sidebar ---------------- */
function renderSidebar(activeHash) {
  let html = '<div class="brand">NewClaw AKB<small>Architecture Knowledge Base</small></div>';
  html += navItem('#/dashboard', '\u{1F4CA} Dashboard', '', activeHash);
  html += navItem('#/diagrams', '\u{1F5FA} Diagramas', '', activeHash);
  html += navItem('#/graph', '\u{1F578} Grafo interativo', '', activeHash);
  html += navItem('#/flows', '\u{1F501} Fluxos', '', activeHash);
  html += '<div class="nav-section-title">Camadas</div>';
  LAYER_ORDER.forEach(l => {
    if (!layers[l]) return;
    html += navItem('#/layer/' + encodeURIComponent(l), l, layers[l].length, activeHash);
  });
  document.getElementById('sidebar').innerHTML = html;
}
function navItem(hash, label, count, activeHash) {
  const active = activeHash === hash ? ' active' : '';
  return '<a class="nav-item' + active + '" href="' + hash + '"><span>' + label + '</span>' + (count!==''?'<span class="count">'+count+'</span>':'') + '</a>';
}

/* ---------------- Dashboard ---------------- */
function renderDashboard() {
  const t = METRICS.totals;

  html += '<p class="subtitle">Por legibilidade (397 componentes / 1142 arestas seria ilegível como um grafo único), o grafo mostra uma camada por vez, ou a vizinhança direta (dependências + consumidores) de um componente buscado. Scroll para zoom, arraste para pan, clique num nó para ver detalhes e destacar dependências/consumidores.</p>';

  document.getElementById('graph-layer-select').addEventListener('change', e => { if (e.target.value) loadGraphForLayer(e.target.value); });
  document.getElementById('graph-node-search').addEventListener('input', e => {
    const v = e.target.value.trim().toLowerCase();
    if (v.length < 2) return;
    const match = ARCH.components.find(c => c.id.toLowerCase().includes(v) || c.path.toLowerCase().includes(v));
    if (match) loadGraphEgo(match.path);
  });

function loadGraphForLayer(layerName) {
  const compPaths = new Set((layers[layerName]||[]).map(c=>c.path));
  const edges = GRAPH.edges.filter(e => compPaths.has(e.from) && compPaths.has(e.to));
  const nodePaths = new Set([...compPaths]);
  buildGraph([...nodePaths], edges, null);
}
function loadGraphEgo(centerPath) {
  const c = byPath[centerPath];
  if (!c) return;
  const nodePaths = new Set([centerPath, ...c.depends_on, ...c.used_by]);
  const edges = GRAPH.edges.filter(e => nodePaths.has(e.from) && nodePaths.has(e.to));
  buildGraph([...nodePaths], edges, centerPath);
}

function buildGraph(nodePaths, edges, centerPath) {
  const svg = document.getElementById('graph-svg');
  const w = svg.clientWidth || 800, h = svg.clientHeight || 560;
  const nodes = nodePaths.map((p,i) => ({ path:p, x: w/2 + (Math.random()-0.5)*w*0.7, y: h/2 + (Math.random()-0.5)*h*0.7, vx:0, vy:0 }));
  const idx = {}; nodes.forEach((n,i)=>idx[n.path]=i);
  const edgeIdx = edges.filter(e=>idx[e.from]!==undefined && idx[e.to]!==undefined).map(e=>({ from: idx[e.from], to: idx[e.to], type: e.type }));

  // simple force layout: springs on edges, repulsion between all pairs, centering force
  for (let iter=0; iter<220; iter++) {
    for (let i=0;i<nodes.length;i++) {
      for (let j=i+1;j<nodes.length;j++) {
        let dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
        let d2 = dx*dx+dy*dy || 1; let d = Math.sqrt(d2);
        let force = 1800 / d2;
        let fx = force*dx/d, fy = force*dy/d;
        nodes[i].x -= fx; nodes[i].y -= fy; nodes[j].x += fx; nodes[j].y += fy;
      }
    }
    edgeIdx.forEach(e => {
      const a = nodes[e.from], b = nodes[e.to];
      let dx=b.x-a.x, dy=b.y-a.y; let d = Math.sqrt(dx*dx+dy*dy)||1;
      let target = 120; let f = (d-target)*0.02;
      let fx = f*dx/d, fy=f*dy/d;
      a.x += fx; a.y += fy; b.x -= fx; b.y -= fy;
    });
    nodes.forEach(n => { n.x += (w/2-n.x)*0.01; n.y += (h/2-n.y)*0.01; n.x=Math.max(30,Math.min(w-30,n.x)); n.y=Math.max(30,Math.min(h-30,n.y)); });
  }

  graphState = { nodes, edgeIdx, selected: null, tx:0, ty:0, scale:1, dragging:false, centerPath };
  drawGraph();
}

function drawGraph() {
  const svg = document.getElementById('graph-svg');
  const { nodes, edgeIdx, selected, tx, ty, scale } = graphState;
  let sel = selected!=null ? nodes[selected] : (graphState.centerPath ? nodes.find((n,i)=>{if(n.path===graphState.centerPath){graphState.selected=i;return true;} return false;}) : null);
  const selIdx = graphState.selected;
  const deps = new Set(), users = new Set();
  if (selIdx!=null) {
    edgeIdx.forEach(e => { if (e.from===selIdx) deps.add(e.to); if (e.to===selIdx) users.add(e.from); });
  }
  let svgHtml = '<g id="graph-g" transform="translate('+tx+','+ty+') scale('+scale+')">';
  edgeIdx.forEach(e => {
    const a = nodes[e.from], b = nodes[e.to];
    let stroke = 'var(--border)', w = 1;
    if (selIdx!=null && e.from===selIdx) { stroke='var(--red)'; w=2; }
    else if (selIdx!=null && e.to===selIdx) { stroke='var(--green)'; w=2; }
    svgHtml += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+stroke+'" stroke-width="'+w+'" opacity="0.7"/>';
  });
  nodes.forEach((n,i) => {
    const c = byPath[n.path];
    let fill = 'var(--gray)';
    if (i===selIdx) fill='var(--accent)';
    else if (deps.has(i)) fill='var(--red)';
    else if (users.has(i)) fill='var(--green)';
    svgHtml += '<circle data-idx="'+i+'" cx="'+n.x+'" cy="'+n.y+'" r="'+(i===selIdx?9:6)+'" fill="'+fill+'" stroke="var(--bg-elev)" stroke-width="1.5" style="cursor:pointer"/>';
    svgHtml += '<text class="node-label" x="'+(n.x+10)+'" y="'+(n.y+4)+'">'+esc(c?c.id:n.path)+'</text>';
  });
  svgHtml += '</g>';
  svg.innerHTML = svgHtml;
  svg.querySelectorAll('circle').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); selectGraphNode(parseInt(el.getAttribute('data-idx'))); });
  });
  if (selIdx!=null) showGraphDetail(nodes[selIdx].path); else document.getElementById('graph-detail').style.display='none';
}
function selectGraphNode(i) { graphState.selected = i; graphState.centerPath = null; drawGraph(); }
function showGraphDetail(p) {
  const c = byPath[p]; const det = document.getElementById('graph-detail');
  if (!c) { det.style.display='none'; return; }
  det.style.display='block';
  det.innerHTML = '<b>'+esc(c.id)+'</b> <span class="badge '+c.confidence+'">'+c.confidence+'</span>' +
    '<div class="subtitle" style="margin:4px 0;">'+esc(c.layer)+' / '+esc(c.type)+'</div>' +
    '<div style="margin-bottom:8px;">'+esc((c.responsibility||'').slice(0,220))+(c.responsibility&&c.responsibility.length>220?'…':'')+'</div>' +
    '<div class="pill-link" onclick="nav(\'#/component/'+encodePath(p)+'\')">ver página completa →</div>';
}
function resetGraphView() { graphState.tx=0; graphState.ty=0; graphState.scale=1; drawGraph(); }

document.addEventListener('DOMContentLoaded', () => {
  const svg = document.getElementById('graph-svg');
  let panStart = null;
  document.addEventListener('wheel', e => {
    if (!e.target.closest('#graph-svg')) return;
    e.preventDefault();
    graphState.scale = Math.max(0.3, Math.min(3, graphState.scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    drawGraph();
  }, { passive:false });
  document.addEventListener('mousedown', e => { if (e.target.closest('#graph-svg') && e.target.tagName==='svg') panStart = {x:e.clientX,y:e.clientY,tx:graphState.tx,ty:graphState.ty}; });
  document.addEventListener('mousemove', e => { if (panStart) { graphState.tx = panStart.tx + (e.clientX-panStart.x); graphState.ty = panStart.ty + (e.clientY-panStart.y); drawGraph(); } });
  document.addEventListener('mouseup', () => panStart=null);
});

/* ---------------- Search ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  const box = document.getElementById('searchbox');
  const results = document.getElementById('searchresults');
  box.addEventListener('input', () => {
    const v = box.value.trim().toLowerCase();
    if (v.length < 2) { results.style.display='none'; return; }
    const matches = ARCH.components.filter(c => c.id.toLowerCase().includes(v) || c.path.toLowerCase().includes(v)).slice(0,25);
    if (!matches.length) { results.style.display='none'; return; }
    results.innerHTML = matches.map(c => '<div class="sr-item" onclick="nav(\'#/component/'+encodePath(c.path)+'\')"><b>'+esc(c.id)+'</b><small>'+esc(c.path)+' — '+esc(c.layer)+'</small></div>').join('');
    results.style.display='block';
  });
  document.addEventListener('click', e => { if (!e.target.closest('#searchbar')) results.style.display='none'; });
});

/* ---------------- Router ---------------- */
function router() {
  const hash = location.hash || '#/dashboard';
  renderSidebar(hash.startsWith('#/layer') ? hash : hash);
  const parts = hash.slice(2).split('/');
  window.scrollTo(0,0);
  document.getElementById('main').scrollTop = 0;
  if (parts[0] === 'layer') renderLayer(decodeURIComponent(parts[1]));
  else if (parts[0] === 'component') renderComponent(decodeURIComponent(parts[1]));
  else if (parts[0] === 'diagrams') renderDiagrams();
  else if (parts[0] === 'graph') renderGraphView();
  else if (parts[0] === 'flows') renderFlows();
  else renderDashboard();
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
</script>
</body>
